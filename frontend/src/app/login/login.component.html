<main class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Welcome back</mat-card-title>
      <mat-card-subtitle>Sign in to continue to Checkmate</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form class="auth-form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="text" [(ngModel)]="email" name="email" required />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" [(ngModel)]="password" name="password" required />
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit">Sign in</button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <span>New to Checkmate?</span>
      <a mat-button color="primary" routerLink="/register">Create an account</a>
    </mat-card-actions>
  </mat-card>
</main>
