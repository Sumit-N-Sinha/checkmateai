<main class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>
        <span class="auth-mark" aria-hidden="true">&#9819;</span>
        <span>Create your account</span>
      </mat-card-title>
      <mat-card-subtitle>Start organizing your checklists with Checkmate</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="social-login">
        <button type="button" class="social-btn google-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.35 12.27c0-.79-.07-1.55-.23-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.91-4.2 2.91-7.42z"/>
            <path fill="#34A853" d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.55 0-4.71-1.72-5.49-4.04H3.27v2.53A9.74 9.74 0 0 0 12 21.5z"/>
            <path fill="#FBBC05" d="M6.51 13.57A5.86 5.86 0 0 1 6.2 12c0-.54.11-1.07.31-1.57V7.9H3.27A9.5 9.5 0 0 0 2.25 12c0 1.48.35 2.88 1.02 4.1l3.24-2.53z"/>
            <path fill="#EA4335" d="M12 6.39c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.51 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.73 5.4l3.24 2.53C7.29 8.11 9.45 6.39 12 6.39z"/>
          </svg>
          <span>Google</span>
        </button>
        <button type="button" class="social-btn apple-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M16.8 12.7c0-2.4 2-3.5 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.6 1.3 10.1.9 1.3 1.9 2.7 3.2 2.7 1.3 0 1.8-.8 3.3-.8 1.5 0 1.9.8 3.3.7 1.4 0 2.3-1.3 3.1-2.6.9-1.4 1.3-2.8 1.3-2.9-.1-.1-2.5-1-4.1-3.2zM14.7 4.5c.7-.8 1.2-2 1.1-3.2-.9.1-2.1.7-2.8 1.5-.6.7-1.2 1.9-1.1 3.1 1 .1 2.1-.6 2.8-1.4z"/>
          </svg>
          <span>Apple</span>
        </button>
      </div>

      <div class="divider"><span>or continue with email</span></div>

      <form class="auth-form" (ngSubmit)="onRegister()">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput type="text" [(ngModel)]="username" name="username" required />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" [(ngModel)]="email" name="email" required />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" [(ngModel)]="password" name="password" required />
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit">Create account</button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <span>Already have an account?</span>
      <button mat-button color="primary" type="button" (click)="openLoginDialog()">Sign in</button>
    </mat-card-actions>
  </mat-card>
</main>
